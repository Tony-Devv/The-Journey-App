# Deploys the download page in docs/ to GitHub Pages.
#
# This publishes the website only. It never touches the Flutter app or any
# GitHub Release, so a normal code push cannot publish a new app release.

name: Deploy download page

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Lets the workflow turn Pages on for itself if it was ever disabled,
          # so a fresh clone cannot fail with "Pages site not found".
          enablement: true

      - name: Upload only the download page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
